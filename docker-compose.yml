services:
  postgres:
    image: postgres:16-alpine
    container_name: genares-postgres
    environment:
      POSTGRES_DB: genares
      POSTGRES_USER: genares
      POSTGRES_PASSWORD: genares_local
    ports:
      - "5432:5432"
    volumes:
      - genares_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genares -d genares"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  genares_postgres_data:
